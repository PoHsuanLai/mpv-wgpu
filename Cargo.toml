[package]
name = "mpv-wgpu"
version = "0.1.0"
edition = "2024"
description = "Embed libmpv software frames in a caller-owned wgpu texture"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rsmpv = { version = "0.2", features = ["render"] }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
naga = "30"
