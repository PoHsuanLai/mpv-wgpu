[package]
name = "mpv-wgpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Draw caller-owned YUV or RGBA pictures into a caller-owned wgpu texture"
license = "MIT OR Apache-2.0"
repository = "https://github.com/PoHsuanLai/mpv-wgpu"
readme = "README.md"
keywords = ["wgpu", "video", "yuv", "graphics"]
categories = ["multimedia::video", "graphics", "rendering"]

[dependencies]
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
pollster = "0.4"
naga = "29"
