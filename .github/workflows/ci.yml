name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libmpv and a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y pkg-config libmpv-dev libvulkan1 mesa-vulkan-drivers
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::unwrap_used
